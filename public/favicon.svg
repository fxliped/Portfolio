<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Felipe Duenas monogram">
  <!--
    8-bit FD monogram, drawn on a 14x10 cell grid to match the pixel art already on
    the page (the pipeline band, the sunset, the lab figures) - so the mark reads as
    part of the design rather than as a default.

    Blackletter was tried first and dropped. Two Old English letters cannot hold at
    the sizes this mark actually renders at: 32px in the nav and 16px in a browser
    tab. Every heavy Textura pair fused into one dark shape, and the narrower faces
    that did survive small sizes turned the D into a U - the pair read "FU", which is
    not a thing to ship on a portfolio. Plain geometry has no such failure mode.

    The cell is exactly 4px at a 64px card, so it lands on whole device pixels at
    16, 32, 64 and 128 - the mark stays crisp instead of blurring into grey. Anything
    that changes `pad` or the grid size breaks that alignment, so change both
    together and re-check. The nav renders it at 32px for the same reason.

    One path, one merged rectangle per horizontal run of cells, so this stays about a
    kilobyte. No inner border: the nav puts its own border on the <img>, and a second
    one inside it just crowded the letters.
  -->
  <rect width="64" height="64" rx="10" fill="#f6f1e4"/>
  <path fill="#0b0c10" d="M4.000 12.000h24.000v4.000h-24.000zM32.000 12.000h24.000v4.000h-24.000zM4.000 16.000h24.000v4.000h-24.000zM32.000 16.000h28.000v4.000h-28.000zM4.000 20.000h8.000v4.000h-8.000zM32.000 20.000h8.000v4.000h-8.000zM52.000 20.000h8.000v4.000h-8.000zM4.000 24.000h8.000v4.000h-8.000zM32.000 24.000h8.000v4.000h-8.000zM52.000 24.000h8.000v4.000h-8.000zM4.000 28.000h20.000v4.000h-20.000zM32.000 28.000h8.000v4.000h-8.000zM52.000 28.000h8.000v4.000h-8.000zM4.000 32.000h20.000v4.000h-20.000zM32.000 32.000h8.000v4.000h-8.000zM52.000 32.000h8.000v4.000h-8.000zM4.000 36.000h8.000v4.000h-8.000zM32.000 36.000h8.000v4.000h-8.000zM52.000 36.000h8.000v4.000h-8.000zM4.000 40.000h8.000v4.000h-8.000zM32.000 40.000h8.000v4.000h-8.000zM52.000 40.000h8.000v4.000h-8.000zM4.000 44.000h8.000v4.000h-8.000zM32.000 44.000h28.000v4.000h-28.000zM4.000 48.000h8.000v4.000h-8.000zM32.000 48.000h24.000v4.000h-24.000z"/>
</svg>
